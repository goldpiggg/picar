name: QR and integration tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 opencv-python-headless==4.10.0.84
      - run: python -m unittest discover -s picar_mission -p 'test_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
