<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiCar 미션 상태</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;color:#182730;background:#f5f7f8}
img{width:100%;max-width:640px;height:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#e7eef0;padding:16px}a{color:#126079}
</style>
<h1>PiCar QR → 30cm 정지</h1>
<p>QR 방향 확정 후 자동으로 전진합니다. 정지 확인 후 방향을 유지하며 대기합니다. 로봇팔 자동 작업은 없습니다.</p>
<button id="stop" type="button" style="font:inherit;padding:12px 24px;background:#a91d25;color:white;border:0">주행 중지</button>
<p id="stop-result" role="status"></p>
<p><a href="/">기본 웹 제어</a> · <a href="/mission/status">상태 JSON</a></p>
<img src="/video_feed" alt="공유 카메라 영상">
<pre id="status" aria-live="polite">상태 확인 중…</pre>
<script>
document.getElementById('stop').onclick=async()=>{const result=document.getElementById('stop-result');try{const r=await fetch('/mission/stop',{method:'POST'});if(!r.ok)throw Error('HTTP '+r.status);result.textContent='중지 요청 처리됨. 다시 시작하려면 서버를 재시작하세요.';}catch(e){result.textContent='중지 요청 실패: '+e.message+' — 로봇 전원을 직접 차단하세요.';}};
async function refresh(){try{const r=await fetch('/mission/status',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const s=await r.json();document.getElementById('status').textContent=JSON.stringify(s,null,2);}catch(e){document.getElementById('status').textContent='서버 연결 확인 필요: '+e.message;}finally{setTimeout(refresh,700);}}refresh();
</script>
</html>
