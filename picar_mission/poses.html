<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiCar 팔 자세 저장</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;color:#182730;background:#f5f7f8}
img{width:100%;max-width:640px;height:auto}a{color:#126079}
button{font:inherit;padding:6px 14px;border:0;background:#126079;color:#fff;cursor:pointer}
button:disabled{background:#9aa9ae;cursor:default}
table{border-collapse:collapse;width:100%}th,td{padding:4px 8px;text-align:left;border-bottom:1px solid #d5e0e3;font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}#msg{min-height:1.6em;font-weight:600}#live{font-size:1.2em}.warn{color:#a91d25}
</style>
<h1>팔 자세 저장</h1>
<p><a href="/" target="_blank">기본 웹 제어</a> 탭의 ARM Control로 자세를 맞춘 뒤, 여기서 해당 이름의 <b>저장</b>을 누르면 <code>arm_poses.json</code>에 바로 기록됩니다. 저장되는 값은 마지막 <b>명령각</b>이므로 실제 팔이 그 자세에 도달했는지 눈으로 확인하세요. 저장해도 <code>calibration_confirmed</code>는 바뀌지 않습니다.</p>
<p id="mode"></p>
<p id="live">현재 명령각 확인 중…</p>
<p id="msg" role="status"></p>
<div class="wrap"><table>
<thead><tr><th>이름</th><th>의미</th><th>저장된 값</th><th></th></tr></thead>
<tbody id="rows"></tbody>
</table></div>
<p>저장 후 서버를 재시작해야 자동 동작에 반영됩니다.</p>
<img src="/video_feed" alt="카메라 영상">
<script>
const $=id=>document.getElementById(id), msg=t=>$('msg').textContent=t;
const SLOTS=[
  ['gripper_open','집게 충분히 열기'],['gripper_closed','스펀지가 실제로 잡히는 닫힘'],
  ['center_clear','중앙 대기·빈 집게 경유'],['center_carry','물체를 들고 중앙 통과'],
  ['left_pick_above','왼쪽 물체 위 접근'],['left_pick','왼쪽 물체 집기'],
  ['left_place_above','왼쪽 놓을 위치 위'],['left_place','왼쪽 놓기'],
  ['right_pick_above','오른쪽 물체 위 접근'],['right_pick','오른쪽 물체 집기'],
  ['right_place_above','오른쪽 놓을 위치 위'],['right_place','오른쪽 놓기']];
let manual=false, built=false;
function stored(p,name){
  if(name.startsWith('gripper_'))return 'gripper '+p.gripper_deg[name.slice(8)];
  const v=p.positions[name];return `base ${v.base} · shoulder ${v.shoulder} · elbow ${v.elbow}`;
}
function render(d){
  manual=d.manual;
  $('mode').innerHTML=manual?'':'<span class="warn">자동 접근 모드입니다. mission_config.json에서 auto_approach_enabled=false, arm_enabled=false로 바꾸고 서버를 재시작하세요.</span>';
  const a=d.angles;
  $('live').textContent=a?'현재 명령각: '+['base','shoulder','elbow','gripper'].map(k=>`${k} ${a[k]}`).join(' · '):'현재 명령각: 아직 읽을 수 없음';
  if(!built){
    $('rows').innerHTML=SLOTS.map(([n,t])=>`<tr><td><code>${n}</code></td><td>${t}</td><td id="v-${n}"></td><td><button data-name="${n}">저장</button></td></tr>`).join('');
    document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>save(b.dataset.name));
    built=true;
  }
  SLOTS.forEach(([n])=>$('v-'+n).textContent=stored(d.profile,n));
  document.querySelectorAll('[data-name]').forEach(b=>b.disabled=!manual||!a);
}
async function save(name){
  try{const r=await fetch('/poses/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    const j=await r.json().catch(()=>({error:'HTTP '+r.status}));
    if(!r.ok)throw Error(j.error||('HTTP '+r.status));
    msg(`저장됨: ${name} ← `+Object.entries(j.saved).map(([k,v])=>`${k} ${v}`).join(' · '));
  }catch(e){msg('저장 실패: '+e.message);}
}
async function refresh(){try{const r=await fetch('/poses/data',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);render(await r.json());}catch(e){$('live').textContent='서버 연결 확인 필요: '+e.message;}finally{setTimeout(refresh,700);}}
refresh();
</script>
</html>
